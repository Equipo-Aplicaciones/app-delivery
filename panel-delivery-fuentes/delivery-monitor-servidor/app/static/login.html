<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar — Panel Delivery</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand"><span class="brand-mark" aria-hidden="true">TD</span><strong>Panel Delivery</strong></div>
    <h1>Entrar</h1>
    <p>Acceso restringido. La sesión se guarda en una cookie HttpOnly; no se usan contraseñas en la URL ni en localStorage.</p>
    <!--ERROR-->
    <form method="post" action="/login" autocomplete="off">
      <label>Usuario
        <input type="text" name="username" required autofocus>
      </label>
      <label>Contraseña
        <input type="password" name="password" required>
      </label>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
