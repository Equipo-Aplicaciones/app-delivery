services:
  app:
    build: .
    env_file:
      - .env
    environment:
      HOME: /home/app
      TZ: ${TZ:-America/Santiago}
      SNAPSHOT_PATH: /app/data/snapshot.json
      MEDIA_DIR: /app/media
      SESSIONS_DIR: /sessions
      UBER_CLI: /app/clients/uber/uber.py
      UBER_CLI_CWD: /app/clients/uber
      PYA_CLI: /app/clients/pya/pya.py
      PYA_CLI_CWD: /app/clients/pya
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./sessions:/sessions
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - monitor

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CADDY_TLS_DIRECTIVE: ${CADDY_TLS:+tls ${CADDY_TLS}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitor

networks:
  monitor:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
