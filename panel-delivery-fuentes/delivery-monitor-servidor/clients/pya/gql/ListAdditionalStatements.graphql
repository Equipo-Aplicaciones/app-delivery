query ListAdditionalStatements($params: ListAdditionalStatementsRequest!) {
  finances {
    listAdditionalStatements(input: $params) {
      nextPageToken
      prevPageToken
      additionalStatements {
        statementId
        statementType
        amountGross
        currency
        statementDate
        globalEntityId
        attachments {
          path
          type
        }
        account {
          grid
          billingParentId
          chainId
        }
      }
    }
  }
}
