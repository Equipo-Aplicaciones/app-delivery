query GetOrderDetails($params: OrderReq!, $orderIssueParams: OrderIssuePicturesReq!, $hasPhotoEvidence: Boolean!) {
  orders {
    order(input: $params) {
      returnOrderPin
      hasBillingData
      isProOrder
      isDisputeAllowed
      dispute {
        status
      }
      order {
        orderId
        placedTimestamp
        status
        globalEntityId
        vendorId
        vendorName
        orderValue
        billableStatus
        delivery {
          provider
          location {
            AddressText
            city
            district
            postCode
          }
        }
        items {
          ...ItemFields
        }
      }
      pin
      orderReceipt {
        uploadedAt
      }
      orderStatuses {
        status
        timestamp
        detail {
          ... on Accepted {
            estimatedDeliveryTime
            commitedPickupTime
          }
          ... on Cancelled {
            owner
            reason
          }
          ... on Delivered {
            timestamp
          }
          ... on PickedUpByRider {
            timestamp
            avoidableWaitTime
          }
          ... on RiderAtVendor {
            timestamp
          }
        }
      }
      billing {
        billingStatus
        isCancelled
        estimatedVendorNetRevenue
        taxTotalAmount
        inputTax
        outputTax
        vendorPayout
        payment {
          cashAmountCollectedByVendor
          paymentType
          method
          paymentFee
        }
        expense {
          serviceFee
          totalDiscountGross
          totalDiscount
          totalVoucher
          totalVendorDiscount
          totalVendorVoucher
          jokerFeeGross
          commissionAmountGross
          commissions {
            type
            grossAmount
            rate
            base
          }
          vendorCharges {
            grossAmount
            reason
          }
          discounts {
            incentiveSource
          }
          waitTimeFee {
            totalCharge
            baseWaitTimeFee
            baseWaitTimeFeeThresholdMinutes
            extraWaitTimeFee
            extraWaitTimeMinutes
            feeLimit
            extraWaitTimeFeePerMinute
            adjustmentForFeeLimit
          }
          vendorCancellationFee {
            grossAmount
            reason
          }
        }
        revenue {
          totalPlatformDiscount
          totalPlatformVoucher
          totalPartnerDiscount
          totalPartnerVoucher
          containerChargesGross
          minimumOrderValueGross
          movSurchargeFeeThreshold
          deliveryFeeGross
          tipGross
          taxCharges {
            total
            taxCharges {
              amount
              reason
            }
          }
          marketingFees {
            total
            marketingFees {
              amount
              reason
            }
          }
          serviceFee
          vendorRefunds {
            grossAmount
            reason
          }
          customerFees {
            reason
            amount
          }
        }
      }
      previousVersions {
        changeAt
        reason
        orderState {
          orderValue
          items {
            ...ItemFields
          }
        }
      }
      orderIssues {
        orderIssue
        metadata {
          reason
          amount
          fee
          deduction
          avoidableWaitTime
          baseWaitTimeFeeThresholdMinutes
        }
      }
      refundData {
        refunds {
          refundId
          amount
          status
          issue
          ccrCode
          method
          source
          notes
          items {
            itemId
            name
            quantity
            refundAmount
            isPartialRefund
            lineItemId
            customerNotes
            options {
              name
              quantity
            }
          }
          fundingSplit {
            amount
            provider
            splitPercentage
          }
        }
      }
    }
    orderIssuePictures(input: $orderIssueParams) @include(if: $hasPhotoEvidence) {
      urls {
        original
        compressed
        thumbnail
      }
    }
  }
}
fragment ItemFields on Item {
  id: productId
  name
  parentName
  quantity
  unitPrice
  customerNotes
  lineItemTotal
  lineItemId
  weight {
    value
    unit
  }
  options {
    id
    name
    quantity
    type
    unitPrice
  }
}