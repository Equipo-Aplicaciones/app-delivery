query ListOutstandingInvoices($params: ListOutstandingInvoicesRequest!) {
  finances {
    listOutstandingInvoices(input: $params) {
      prevPageToken
      nextPageToken
      invoices {
        id
        processedDate
        ordersCount
        currency
        totalPayout
        attachments
        account {
          billingParentId
          chainId
          grid
        }
      }
    }
  }
}
