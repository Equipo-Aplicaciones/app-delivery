query UpdateOrders($params: ListOrderChangesReq!) {
  orders {
    listOrderChanges(input: $params) {
      resultTimestamp
      orders {
        ...OrderListingFields
      }
    }
  }
}
fragment OrderListingFields on OrderSummary {
  orderId
  globalEntityId
  vendorId
  vendorName
  orderStatus
  placedTimestamp
  subtotal
  billableStatus
  deliveryType
  billing {
    commissionAmount
    netRevenue
  }
  orderIssuesDetails {
    orderIssue
    metadata {
      reason
      amount
      deduction
      fee
      avoidableWaitTime
      baseWaitTimeFeeThresholdMinutes
    }
  }
  totalFeesAndDeductions
}