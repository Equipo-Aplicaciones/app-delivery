query getCombinedPayout($params: GetCombinedPayoutRequest!) {
  finances {
    getCombinedPayout(input: $params) {
      payout {
        payoutId: id
        payoutAmount: netPayout
        payoutCurrency: currency
        payoutOrders: ordersCount
        at: paymentDateLocal
        status: payoutStatus
        payoutAttachments: attachments
        payoutAccount: account {
          grid
          billingParentId
          chainId
        }
        payoutsTimeRange {
          startDate
          endDate
        }
        timeline {
          status
          updatedAt
        }
      }
      totalNetPayout
      taxes
      invoice {
        globalEntityId
        totalPayout
        attachments
        currency
        id
        netEarnings
        ordersCount
        processedDate
        earningsPeriod {
          invoiceStartDate
          invoiceEndDate
        }
      }
      invoices {
        account {
          grid
          billingParentId
          chainId
        }
        globalEntityId
        totalPayout
        attachments
        currency
        id
        netEarnings
        ordersCount
        processedDate
        earningsPeriod {
          invoiceStartDate
          invoiceEndDate
        }
      }
      breakdown {
        grossSales
        cashCollected
        loans {
          loans {
            amount
            reason
          }
          total
        }
        taxCharges {
          taxChargeList {
            amount
            reason
          }
          total
        }
        additionalSales {
          total
          deliveryFees
          packagingFees
          movFees
          foodCostReimbursement
          tips
          additionalEarnings {
            reason
            amount
          }
        }
        discounts {
          discountsBySelf
          discountsByBrand
        }
        vouchers {
          vouchersBySelf
          vouchersByBrand
        }
        customerRefundCharges {
          total
          charges {
            reason
            amount
          }
        }
        additionalFees {
          total
          paymentFee
          additionalCharges {
            amount
            reason
          }
        }
        marketingFees {
          total
          marketingFee {
            type
            amount
          }
        }
        commissions {
          total
          commissionList {
            amount
            type
          }
        }
        customerFees {
          reason
          amount
        }
        waitTimeFee {
          totalCharge
        }
        currentBalance
      }
    }
  }
}
