query GetLoanOffers($params: GetLoanOffersRequest!) {
  finances {
    getLoanOffers(input: $params) {
      offers {
        ...LoanOfferFields
      }
    }
  }
}
fragment LoanOfferFields on LoanOfferDetail {
  id
  maxCapital
  expirationDate
  clientSegment
  customData {
    bestTierAccount
    memberDiscount
  }
}