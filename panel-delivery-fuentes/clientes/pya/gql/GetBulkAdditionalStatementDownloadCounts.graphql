query GetBulkAdditionalStatementDownloadCounts($params: GetBulkAdditionalStatementDownloadCountsRequest!) {
  finances {
    getBulkAdditionalStatementDownloadCounts(input: $params) {
      fileCounts {
        totalFilesCount
        fileCountsDetails {
          filesCount
          fileFormat
        }
      }
      fileLimits {
        directDownloadLimit
        emailDownloadLimit
      }
    }
  }
}
