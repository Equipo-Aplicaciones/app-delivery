query getInvoiceDetails($params: GetInvoiceDetailsRequest!) {
  finances {
    getInvoiceDetails(input: $params) {
      totalNetPayout
      taxes
      invoice {
        globalEntityId
        totalPayout
        attachments
        currency
        id
        netEarnings
        ordersCount
        processedDate
        earningsPeriod {
          invoiceStartDate
          invoiceEndDate
        }
      }
      breakdown {
        grossSales
        cashCollected
        loans {
          loans {
            amount
            reason
          }
          total
        }
        taxCharges {
          taxChargeList {
            amount
            reason
          }
          total
        }
        additionalSales {
          total
          deliveryFees
          packagingFees
          movFees
          foodCostReimbursement
          tips
          additionalEarnings {
            reason
            amount
          }
        }
        discounts {
          discountsBySelf
          discountsByBrand
        }
        vouchers {
          vouchersBySelf
          vouchersByBrand
        }
        customerRefundCharges {
          total
          charges {
            reason
            amount
          }
        }
        additionalFees {
          total
          paymentFee
          additionalCharges {
            amount
            reason
          }
        }
        marketingFees {
          total
          marketingFee {
            type
            amount
          }
        }
        commissions {
          total
          commissionList {
            amount
            type
          }
        }
        waitTimeFee {
          totalCharge
        }
        currentBalance
        customerFees {
          reason
          amount
        }
      }
    }
  }
}
